  expected_domains: [mobile-hybrid]
  answer: "앱 하단 탭은 4개로 '홈', '알림', '탐색', '내 정보' 순서입니다. 기본 탭바 대신 떠 있는 형태의 FloatingTabBar를 씁니다."
