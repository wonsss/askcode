- id: q22
  type: decision
  question: "수집 워커에서 Redis랑 BullMQ를 왜 뺐어요?"
  expected_behavior: answer
  expected_domains: [ingestion]
  answer: "워커는 항상 프로세스 하나로만 돌아 큐의 분산 처리 이점을 쓰지 않았는데, Upstash 무료 Redis 위의 BullMQ 상시 폴링이 일일 요청 한도(500,000건)를 소진시켜 워커(및 캐시를 공유하던 API)가 멈추는 장애가 났습니다. 그래서 2026-08-07에 @nestjs/schedule in-process cron으로 바꿔 Redis 의존을 없앴고, 수집 이력 기준은 계속 PostgreSQL IngestionRun입니다."
  evidence:
    - path: docs/decisions/08-technology-stack.md
      lines: "78-99"
    - path: apps/worker/src/scheduling/scheduler.service.ts
      lines: "24-43"
  notes: "단일 프로세스라 분산 불필요 + Upstash 한도 소진 장애 + in-process cron 대체가 모두 있어야 정답."

- id: q23
  type: decision
  question: "공식 원문(SourceRecord)을 API 응답 단위로 저장하기로 한 이유가 뭐예요?"
  expected_behavior: answer
  expected_domains: [ingestion]
  answer: "수집 시작 나흘 만인 2026-08-08에 당시 DB(Supabase Free, 한도 500MB)를 실사용 1,487MB로 초과했고, 원인이 원문을 행 단위로 쪼개 저장한 데 있었기 때문입니다. ADR-16은 SourceRecord 하나를 원문이 서술하는 도메인 엔터티 하나에 대응시키기로 했습니다(예: 표결 296행 응답 = plenary_vote 1건). 행으로 쪼개면 누락·불참을 원문에서 복원할 수 없다는 정확성 이유도 있습니다."
  evidence:
    - path: docs/decisions/16-adr-source-record-granularity.md
      lines: "16-20"
    - path: docs/decisions/16-adr-source-record-granularity.md
      lines: "111-133"
  notes: "ADR 상태는 'Proposed'(3행). 용량 초과 배경과 '엔터티 1개 = SourceRecord 1개' 결정이 핵심. 현재 DB는 Vultr PostgreSQL이라는 맥락(8-11행)을 섞어도 무방."

