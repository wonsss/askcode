[project]
name = "askcode"
version = "0.1.0"
description = "기획자가 슬랙에서 코드베이스와 기획 문서에 질문하는 봇"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiohttp>=3.14.5",
    "anthropic>=1.14.0",
    "claude-agent-sdk>=0.2.167",
    "cryptography>=50.0.2",
    "httpx>=0.28.1",
    "pydantic-settings>=2.16.0",
    "pyjwt>=2.15.1",
    "pyyaml>=6.0.3",
    "slack-bolt>=1.30.0",
    "starlette>=1.8.0",
    "uvicorn>=0.54.0",
]

[project.scripts]
askcode = "askcode.cli:main"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[build-system]
requires = ["uv_build>=0.11.32,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]
